<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Content Planner</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #fbfbfd;
    --surface-3: #f0f0f2;
    --ink: #1d1d1f;
    --ink-muted: #6e6e73;
    --ink-faint: #a1a1a6;
    --line: rgba(0,0,0,0.08);
    --line-strong: rgba(0,0,0,0.14);
    --accent: #0071e3;
    --accent-weak: rgba(0,113,227,0.10);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 1px rgba(0,0,0,0.03), 0 10px 30px -14px rgba(0,0,0,0.16);

    --st-pendiente: #8e8e93;   --st-pendiente-bg: rgba(142,142,147,0.13);
    --st-produccion: #ff9500;  --st-produccion-bg: rgba(255,149,0,0.13);
    --st-listo: #5e5ce6;       --st-listo-bg: rgba(94,92,230,0.11);
    --st-publicado: #34c759;   --st-publicado-bg: rgba(52,199,89,0.13);
    --st-error: #ff3b30;       --st-error-bg: rgba(255,59,48,0.11);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #232326;
      --surface-3: #2c2c2e;
      --ink: #f5f5f7;
      --ink-muted: #98989d;
      --ink-faint: #636366;
      --line: rgba(255,255,255,0.09);
      --line-strong: rgba(255,255,255,0.16);
      --accent: #0a84ff;
      --accent-weak: rgba(10,132,255,0.16);
      --shadow: 0 1px 1px rgba(0,0,0,0.4), 0 10px 30px -14px rgba(0,0,0,0.7);

      --st-pendiente: #98989d;   --st-pendiente-bg: rgba(152,152,157,0.16);
      --st-produccion: #ff9f0a;  --st-produccion-bg: rgba(255,159,10,0.16);
      --st-listo: #7d7aff;       --st-listo-bg: rgba(125,122,255,0.16);
      --st-publicado: #30d158;  --st-publicado-bg: rgba(48,209,88,0.16);
      --st-error: #ff453a;      --st-error-bg: rgba(255,69,58,0.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #232326; --surface-3: #2c2c2e;
    --ink: #f5f5f7; --ink-muted: #98989d; --ink-faint: #636366;
    --line: rgba(255,255,255,0.09); --line-strong: rgba(255,255,255,0.16);
    --accent: #0a84ff; --accent-weak: rgba(10,132,255,0.16);
    --shadow: 0 1px 1px rgba(0,0,0,0.4), 0 10px 30px -14px rgba(0,0,0,0.7);
    --st-pendiente: #98989d;   --st-pendiente-bg: rgba(152,152,157,0.16);
    --st-produccion: #ff9f0a;  --st-produccion-bg: rgba(255,159,10,0.16);
    --st-listo: #7d7aff;       --st-listo-bg: rgba(125,122,255,0.16);
    --st-publicado: #30d158;  --st-publicado-bg: rgba(48,209,88,0.16);
    --st-error: #ff453a;      --st-error-bg: rgba(255,69,58,0.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.47;
    -webkit-font-smoothing: antialiased;
  }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--accent); }

  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 20px 120px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .heading .kicker {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    margin-bottom: 2px;
  }
  h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .save-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-top: 6px;
  }
  .save-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); flex: 0 0 auto; }
  .save-status[data-state="saved"] .dot { background: var(--st-publicado); }
  .save-status[data-state="pending"] .dot { background: var(--st-produccion); }
  .save-status[data-state="pending"] .txt { color: var(--st-produccion); font-weight: 600; }
  .save-status[data-state="saving"] .dot { background: var(--st-produccion); animation: pulse 1s ease-in-out infinite; }
  .save-status[data-state="error"] .dot,
  .save-status[data-state="readonly"] .dot { background: var(--st-error); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  @media (prefers-reduced-motion: reduce) { .save-status[data-state="saving"] .dot { animation: none; } }

  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 980px;
    color: var(--ink);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--surface-3); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: none; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.subtle { background: transparent; box-shadow: none; color: var(--ink-muted); padding: 8px 10px; }
  .btn.subtle:hover { color: var(--ink); background: var(--surface-3); }

  .btn.save-cta { background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line-strong); color: var(--ink); }
  .btn.save-cta:hover { border-color: var(--accent); color: var(--accent); }
  .btn.save-cta:active { transform: scale(0.97); }
  .btn.save-cta.flash { border-color: var(--st-publicado); color: var(--st-publicado); background: var(--st-publicado-bg); }
  @media (prefers-reduced-motion: no-preference) { .btn.save-cta { transition: transform 0.1s ease, border-color 0.15s ease, color 0.15s ease, background 0.15s ease; } }
  .btn svg { width: 15px; height: 15px; }

  /* ---------- Controls row: month nav + view toggle ---------- */
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav button {
    all: unset; cursor: pointer;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--ink-muted);
  }
  .month-nav button:hover { background: var(--surface-3); color: var(--ink); }
  .month-nav button svg { width: 16px; height: 16px; }
  .month-label {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    min-width: 150px;
    text-align: center;
  }
  .segmented {
    display: inline-flex;
    background: var(--surface-3);
    border-radius: 980px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    all: unset; cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 980px;
    color: var(--ink-muted);
  }
  .segmented button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* ---------- Stats ---------- */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .stat {
    background: var(--surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat .top { display: flex; align-items: center; gap: 6px; }
  .stat .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
  .stat[data-status="pendiente"]  { --dot: var(--st-pendiente); }
  .stat[data-status="produccion"] { --dot: var(--st-produccion); }
  .stat[data-status="listo"]      { --dot: var(--st-listo); }
  .stat[data-status="publicado"]  { --dot: var(--st-publicado); }
  .stat[data-status="error"]      { --dot: var(--st-error); }
  .stat .n { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .stat .label { font-size: 12px; color: var(--ink-muted); }

  /* ---------- Empty state ---------- */
  .empty-month {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-muted);
  }
  .empty-month p { margin: 6px 0 16px; }

  /* ---------- Platform icons ---------- */
  .picon { width: 16px; height: 16px; flex: 0 0 auto; display: block; }
  .picon-sm { width: 13px; height: 13px; flex: 0 0 auto; display: block; }

  /* ---------- Day cards ---------- */
  .rundown { display: flex; flex-direction: column; gap: 10px; }

  details.day-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  details.day-card > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 20px;
  }
  details.day-card > summary::-webkit-details-marker { display: none; }
  details.day-card > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius-lg); }

  .date-block { display: flex; align-items: baseline; gap: 8px; min-width: 118px; }
  .date-block .dnum { font-size: 28px; font-weight: 300; letter-spacing: -0.02em; }
  .date-block .wdmo { display: flex; flex-direction: column; line-height: 1.15; }
  .date-block .wd { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .date-block .mo { font-size: 11.5px; color: var(--ink-muted); }
  .day-card.today .date-block .dnum,
  .day-card.today .date-block .wd { color: var(--accent); }

  .platform-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; flex: 1; }
  .chip-mini { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-muted); font-weight: 500; }

  .status-bar { display: flex; width: 84px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--surface-3); flex: 0 0 auto; }
  .status-bar span { display: block; height: 100%; }
  .status-bar .b-pendiente  { background: var(--st-pendiente); }
  .status-bar .b-produccion { background: var(--st-produccion); }
  .status-bar .b-listo      { background: var(--st-listo); }
  .status-bar .b-publicado  { background: var(--st-publicado); }
  .status-bar .b-error      { background: var(--st-error); }

  .day-count { font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; flex: 0 0 auto; }

  .chevron { flex: 0 0 auto; color: var(--ink-faint); transition: transform 0.18s ease; }
  .chevron svg { width: 13px; height: 13px; }
  details[open] > summary .chevron { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }

  .pieces { border-top: 1px solid var(--line); }

  details.piece { border-bottom: 1px solid var(--line); }
  details.piece:last-of-type { border-bottom: none; }
  details.piece[open] { background: var(--surface-2); }
  details.piece > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
  }
  details.piece > summary::-webkit-details-marker { display: none; }
  details.piece > summary:hover { background: var(--surface-2); }
  details.piece > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .p-platform { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; min-width: 128px; flex: 0 0 auto; }
  .p-format { font-size: 13px; color: var(--ink-muted); min-width: 68px; flex: 0 0 auto; }

  .angle { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .angle.empty { color: var(--ink-faint); font-style: italic; }

  .pill { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 980px; white-space: nowrap; flex: 0 0 auto; }
  .pill.pendiente  { color: var(--st-pendiente); background: var(--st-pendiente-bg); }
  .pill.produccion { color: var(--st-produccion); background: var(--st-produccion-bg); }
  .pill.listo      { color: var(--st-listo); background: var(--st-listo-bg); }
  .pill.publicado  { color: var(--st-publicado); background: var(--st-publicado-bg); }
  .pill.error      { color: var(--st-error); background: var(--st-error-bg); }

  .mini-links { display: flex; gap: 3px; flex: 0 0 auto; }
  .mlink { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--ink-faint); }
  .mlink svg { width: 12px; height: 12px; }
  .mlink.filled { color: var(--accent); }

  .mlink-del {
    all: unset; cursor: pointer;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    color: var(--ink-faint);
    flex: 0 0 auto;
  }
  .mlink-del svg { width: 13px; height: 13px; }
  .mlink-del:hover { color: var(--st-error); background: var(--st-error-bg); }
  .mlink-del.armed { color: var(--st-error); background: var(--st-error-bg); }
  .mlink-del:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .mlink-dup {
    all: unset; cursor: pointer;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    color: var(--ink-faint);
    flex: 0 0 auto;
  }
  .mlink-dup svg { width: 13px; height: 13px; }
  .mlink-dup:hover { color: var(--accent); background: var(--accent-weak); }
  .mlink-dup:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .linkfield { display: flex; gap: 6px; align-items: center; }
  .linkfield input { flex: 1; }
  .open-btn {
    width: 34px; height: 34px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    background: var(--surface); border: 1px solid var(--line);
    color: var(--ink-muted);
    text-decoration: none;
    cursor: pointer;
  }
  .open-btn svg { width: 14px; height: 14px; }
  .open-btn:hover { color: var(--accent); border-color: var(--accent); }
  .open-btn.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .open-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .piece-detail { padding: 4px 20px 20px 20px; display: flex; flex-direction: column; gap: 14px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-faint); text-transform: uppercase; }
  .field input[type="text"], .field input[type="url"], .field input[type="date"], .field textarea, .field select {
    all: unset;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 13.5px;
    width: 100%;
  }
  .field textarea { min-height: 64px; resize: vertical; line-height: 1.45; white-space: pre-wrap; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .field-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 200px; }
  .field-row-3 .field { min-width: 140px; }

  .note-banner {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--st-error-bg); color: var(--st-error);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12.5px;
  }

  .piece-detail-footer { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .danger-btn {
    all: unset; cursor: pointer;
    font-size: 12.5px; font-weight: 500;
    color: var(--st-error);
    padding: 6px 10px;
    border-radius: var(--radius-sm);
  }
  .danger-btn:hover { background: var(--st-error-bg); }

  .add-piece-row { padding: 10px 20px 16px; }
  .add-piece-row button {
    all: unset; cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--accent);
    padding: 6px 4px;
  }

  .fab {
    all: unset; cursor: pointer;
    position: fixed;
    right: 28px; bottom: 28px;
    background: var(--accent); color: #fff;
    width: 54px; height: 54px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px -4px rgba(0,113,227,0.55), var(--shadow);
  }
  .fab svg { width: 22px; height: 22px; }
  .fab:hover { filter: brightness(1.05); }
  .fab:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.32);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px -12px rgba(0,0,0,0.35);
    width: 100%; max-width: 380px;
    padding: 22px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  /* ---------- Lista (table) view ---------- */
  .table-wrap {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  table.lista { width: 100%; border-collapse: collapse; min-width: 760px; }
  table.lista th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--surface);
  }
  table.lista td {
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    font-size: 13.5px; vertical-align: top;
  }
  table.lista tr:last-child td { border-bottom: none; }
  table.lista .cell-platform { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  table.lista .cell-angle { max-width: 220px; }
  table.lista .cell-copy { max-width: 260px; color: var(--ink-muted); }
  table.lista .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  table.lista .empty { color: var(--ink-faint); font-style: italic; }
  table.lista a.link { font-size: 12.5px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 980px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="45%" stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#833AB4"/>
    </linearGradient>

    <symbol id="i-instagram" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#ig-grad)" stroke-width="2"/>
      <circle cx="12" cy="12" r="5" fill="none" stroke="url(#ig-grad)" stroke-width="2"/>
      <circle cx="17.3" cy="6.7" r="1.4" fill="url(#ig-grad)"/>
    </symbol>
    <symbol id="i-facebook" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="#1877F2"/>
      <path d="M13.6 21v-7.2h2.3l.35-2.8h-2.65V9.2c0-.8.2-1.35 1.35-1.35h1.42V5.7c-.25-.03-1.1-.1-2.1-.1-2.1 0-3.5 1.28-3.5 3.62v2.06H8.6v2.8h2.17V21z" fill="#fff"/>
    </symbol>
    <symbol id="i-linkedin" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="20" rx="4" fill="#0A66C2"/>

<script id="seed-data" type="application/json">
`;

  function buildFullHtml() {
    var seedJson = JSON.stringify({ pieces: flattenPieces() }, null, 2);
    var appSrc = TableroApp.toString();
    // The closing-script-tag text below is deliberately split with a backslash — written
    // whole, that raw byte sequence inside this very script element would make the HTML
    // tokenizer end the tag right there, breaking the page it's meant to produce.
    return PAGE_HEAD + seedJson +
      '\n<\/script>\n\n<script>\n' + appSrc +
      '\nTableroApp(JSON.parse(document.getElementById(\'seed-data\').textContent));\n' +
      '<\/script>\n\n</body>\n</html>\n';
  }

  // ---------- persistence ----------
  // Saving is manual-only (the "Guardar" button) — see markDirty. Nothing auto-publishes while
  // editing, because every publish reloads this view, which used to collapse whatever was open
  // mid-edit. saveTimer below is used only to retry after a transient publish error.
  function saveNow() {
    clearTimeout(saveTimer);
    if (hasUnsavedChanges()) doSave();
  }

  // Gives a manual "Guardar" click visible feedback regardless of what triggered it —
  // the click itself is confirmed instantly; the header status dot tracks the real network result.
  function handleSaveClick(btn) {
    var label = btn.querySelector('.btn-label');
    if (!hasUnsavedChanges()) {
      showToast('Ya está todo guardado.');
      if (label) {
        var original = label.textContent;
        btn.classList.add('flash');
        label.textContent = '✓ Guardado';
        setTimeout(function () { btn.classList.remove('flash'); label.textContent = original; }, 1400);
      }
      return;
    }
    if (label) { label.textContent = 'Guardando…'; }
    saveNow();
    setTimeout(function () {
      if (!label) return;
      btn.classList.add('flash');
      label.textContent = '✓ Guardado';
      setTimeout(function () { btn.classList.remove('flash'); label.textContent = 'Guardar'; }, 1400);
    }, 700);
  }

  function doSave() {
    if (saveInFlight) return; // a publish is already running; it will re-check and re-save when it finishes
    if (!hasUnsavedChanges()) { setSaveStatus('saved', 'Guardado'); return; }
    if (!window.claude || !window.claude.use) { setSaveStatus('local', 'Cambios solo en esta sesión'); return; }

    var snapshotVersion = docVersion;
    var html = buildFullHtml();
    stashUiState();

    saveInFlight = true;
    window.claude.use('artifact').then(function (ns) {
      if (!ns) { saveInFlight = false; setSaveStatus('local', 'Cambios solo en esta sesión'); return; }
      return ns.publish(html).then(function () {
        // A successful html-form publish reloads this view — this just covers the moment before that happens.
        docSavedVersion = snapshotVersion;
        saveInFlight = false;
        setSaveStatus('saved', 'Guardado');
      }).catch(function (err) {
        saveInFlight = false;
        handleSaveError(err);
      });
    }).catch(function (err) {
      console.error('[tablero] claude.use("artifact") failed:', err);
      saveInFlight = false;
      setSaveStatus('local', 'Cambios solo en esta sesión');
    });
  }

  function handleSaveError(err) {
    var code = err && err.code;
    console.error('[tablero] publish failed:', err);
    if (code === 'conflict') {
      // Someone else published first — the platform is already reloading every open view
      // (this one included) to that winning version, so there's nothing to reconcile by hand.
      setSaveStatus('saving', 'Sincronizando con la última versión…');
      showToast('Se actualizó con cambios guardados por otra persona.');
    } else if (code === 'not_writer' || code === 'not_granted') {
      writable = false;
      setSaveStatus('readonly', 'Solo lectura');
    } else if (code === 'rate_limited') {
      setSaveStatus('error', 'Reintentando (' + code + ')…');
      saveTimer = setTimeout(doSave, 3000);
    } else if (code === 'upstream_error') {
      setSaveStatus('error', 'Reintentando (' + code + ')…');
      saveTimer = setTimeout(doSave, 2500);
    } else {
      setSaveStatus('error', 'No se pudo guardar — ' + (code || (err && err.message) || 'error desconocido'));
    }
  }

  function setSaveStatus(state, text) {
    var el = $('save-status');
    el.setAttribute('data-state', state);
    el.querySelector('.txt').textContent = text;
  }

  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  // ---------- mutations ----------
  function addPiece(date, platform, format, angle) {
    var mk = monthKey(date);
    var piece = { id: uid(), date: date, platform: platform, format: format, angle: angle || '', copy: '', material: '', portada: '', estado: 'pendiente', notas: '', publicado: '' };
    ensureMonthArray(mk).push(piece);
    markDirty();
    var parts = mk.split('-').map(Number);
    currentMonth = { y: parts[0], m: parts[1] };
    renderAll(piece.id);
  }

  function updateField(id, field, value) {
    var found = findPieceById(id);
    if (!found) return;
    if (field === 'date') {
      var newMk = monthKey(value);
      if (newMk !== found.mk) {
        found.piece.date = value;
        ensureMonthArray(found.mk).splice(found.idx, 1);
        ensureMonthArray(newMk).push(found.piece);
        markDirty();
        return;
      }
    }
    var oldPlatform = found.piece.platform;
    found.piece[field] = value;
    if (field === 'platform' && value !== oldPlatform) {
      if (usesFreeformFormat(value)) {
        found.piece.format = '';
      } else if (formatsFor(value).indexOf(found.piece.format) === -1) {
        found.piece.format = formatsFor(value)[0];
      }
    }
    markDirty();
  }

  function removePiece(id) {
    var found = findPieceById(id);
    if (!found) return;
    ensureMonthArray(found.mk).splice(found.idx, 1);
    markDirty();
    renderAll();
    showToast('Pieza eliminada — tocá Guardar para confirmar.');
  }

  // Same date/ángulo/copy/material/portada/notas — for repurposing one piece of content
  // across platforms without retyping it. Estado vuelve a "pendiente" y el link publicado se
  // limpia, porque la copia todavía no salió; la plataforma queda igual para editarla al toque.
  function duplicatePiece(id) {
    var found = findPieceById(id);
    if (!found) return;
    var copy = {};
    Object.keys(found.piece).forEach(function (k) { copy[k] = found.piece[k]; });
    copy.id = uid();
    copy.estado = 'pendiente';
    copy.publicado = '';
    ensureMonthArray(found.mk).splice(found.idx + 1, 0, copy);
    markDirty();
    renderAll(copy.id);
    showToast('Pieza duplicada — ajustá la plataforma y el copy.');
  }

  // ---------- rendering ----------
  function collectOpenState() {
    var open = { days: {}, pieces: {} };
    document.querySelectorAll('details.day-card[open]').forEach(function (d) { open.days[d.dataset.day] = true; });
    document.querySelectorAll('details.piece[open]').forEach(function (d) { open.pieces[d.dataset.id] = true; });
    if (pendingRestoreOpen) {
      Object.keys(pendingRestoreOpen.days).forEach(function (d) { open.days[d] = true; });
      Object.keys(pendingRestoreOpen.pieces).forEach(function (p) { open.pieces[p] = true; });
      pendingRestoreOpen = null; // consume once — subsequent renders reflect real DOM state again
    }
    return open;
  }

  function monthPieces() {
    var mk = currentMonth.y + '-' + pad2(currentMonth.m);
    return ensureMonthArray(mk);
  }

  function renderAll(forceOpenId) {
    $('month-label').textContent = MO_FULL[currentMonth.m - 1] + ' ' + currentMonth.y;
    var open = collectOpenState();
    if (forceOpenId) {
      open.pieces[forceOpenId] = true;
      var forced = findPieceById(forceOpenId);
      if (forced) open.days[forced.piece.date] = true;
    }

    var pieces = monthPieces();
    renderStats(pieces);

    var content = $('content');
    if (viewMode === 'agenda') {
      content.innerHTML = renderAgenda(pieces, open, forceOpenId);
    } else {
      content.innerHTML = renderLista(pieces);
    }
  }

  function renderStats(pieces) {
    var counts = { pendiente: 0, produccion: 0, listo: 0, publicado: 0, error: 0 };
    pieces.forEach(function (p) { if (counts[p.estado] !== undefined) counts[p.estado]++; });
    var order = ['pendiente', 'produccion', 'listo', 'publicado', 'error'];
    $('stats').innerHTML = order.map(function (k) {
      return '<div class="stat" data-status="' + k + '">' +
        '<div class="top"><span class="swatch"></span><span class="n tnum">' + counts[k] + '</span></div>' +
        '<span class="label">' + STATUS_META[k].label + '</span></div>';
    }).join('');
  }

  function renderAgenda(pieces, open, forceOpenId) {
    if (!pieces.length) {
      return '<div class="empty-month"><p>No hay piezas planificadas para este mes todavía.</p>' +
        '<button class="btn primary" id="empty-add-btn"><svg><use href="#i-plus"/></svg>Agregar la primera pieza</button></div>';
    }
    var byDate = {};
    pieces.forEach(function (p) { (byDate[p.date] = byDate[p.date] || []).push(p); });
    var dates = Object.keys(byDate).sort();
    var t = todayLocal();
    var todayStr = toDateInputValue(t);

    return '<div class="rundown">' + dates.map(function (date) {
      var dayPieces = byDate[date];
      var d = parseDate(date);
      var isToday = date === todayStr;
      var isOpen = !!open.days[date];
      var counts = { pendiente: 0, produccion: 0, listo: 0, publicado: 0, error: 0 };
      dayPieces.forEach(function (p) { counts[p.estado]++; });
      var platformCounts = {};
      dayPieces.forEach(function (p) { platformCounts[p.platform] = (platformCounts[p.platform] || 0) + 1; });

      var barSegs = ['pendiente', 'produccion', 'listo', 'publicado', 'error'].filter(function (k) { return counts[k] > 0; })
        .map(function (k) { return '<span class="b-' + k + '" style="width:' + (counts[k] / dayPieces.length * 100) + '%"></span>'; }).join('');

      var chipHtml = Object.keys(platformCounts).map(function (pf) {
        return '<span class="chip-mini"><svg class="picon-sm"><use href="#' + PLATFORM_META[pf].icon + '"/></svg>' + platformCounts[pf] + '</span>';
      }).join('');

      return '<details class="day-card' + (isToday ? ' today' : '') + '" data-day="' + date + '"' + (isOpen ? ' open' : '') + '>' +
        '<summary>' +
          '<div class="date-block">' +
            '<span class="dnum tnum">' + d.getDate() + '</span>' +
            '<div class="wdmo"><span class="wd">' + WD[d.getDay()] + '</span><span class="mo">' + MO_SHORT[d.getMonth()] + '</span></div>' +
          '</div>' +
          '<div class="platform-summary">' + chipHtml + '</div>' +
          '<div class="status-bar">' + barSegs + '</div>' +
          '<span class="day-count">' + dayPieces.length + (dayPieces.length === 1 ? ' pieza' : ' piezas') + '</span>' +
          '<span class="chevron"><svg><use href="#i-chevron"/></svg></span>' +
        '</summary>' +
        '<div class="pieces">' +
          dayPieces.map(function (p) { return renderPiece(p, !!open.pieces[p.id] || p.id === forceOpenId); }).join('') +
        '</div>' +
        '<div class="add-piece-row"><button data-action="add-to-day" data-date="' + date + '">+ Agregar pieza a este día</button></div>' +
      '</details>';
    }).join('') + '</div>';
  }

  function normalizeUrl(v) {
    v = (v || '').trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function linkFieldHtml(p, field, placeholder) {
    var val = p[field] || '';
    var url = normalizeUrl(val);
    return '<div class="linkfield">' +
      '<input type="text" value="' + esc(val) + '" data-id="' + p.id + '" data-field="' + field + '" placeholder="' + esc(placeholder) + '">' +
      '<a class="open-btn' + (url ? '' : ' disabled') + '"' + (url ? ' href="' + esc(url) + '"' : '') + ' target="_blank" rel="noopener noreferrer" title="Abrir link"><svg><use href="#i-open"/></svg></a>' +
      '</div>';
  }

  function formatFieldHtml(p) {
    if (usesFreeformFormat(p.platform)) {
      var meta = FREEFORM_META[p.platform];
      return '<div class="field"><label>' + esc(meta.label) + '</label><input type="text" value="' + esc(p.format) + '" data-id="' + p.id + '" data-field="format" placeholder="' + esc(meta.placeholder) + '"></div>';
    }
    return '<div class="field"><label>Formato</label><select data-id="' + p.id + '" data-field="format">' +
      formatsFor(p.platform).map(function (k) { return '<option value="' + k + '"' + (k === p.format ? ' selected' : '') + '>' + FORMAT_LABEL[k] + '</option>'; }).join('') +
      '</select></div>';
  }

  function renderPiece(p, isOpen) {
    var pf = PLATFORM_META[p.platform] || PLATFORM_META.instagram;
    var st = STATUS_META[p.estado] || STATUS_META.pendiente;
    var mini = [
      ['copy', 'i-copy', p.copy, 'Copy'],
      ['material', 'i-material', p.material, 'Material'],
      ['portada', 'i-portada', p.portada, 'Portada'],
      ['notas', 'i-notas', p.notas, 'Notas'],
      ['publicado', 'i-publicado', p.publicado, 'Link publicado']
    ].map(function (m) {
      var filled = m[2] && m[2].trim();
      return '<span class="mlink' + (filled ? ' filled' : '') + '" title="' + (filled ? m[3] + ' cargado' : 'Sin ' + m[3].toLowerCase()) + '"><svg><use href="#' + m[1] + '"/></svg></span>';
    }).join('');

    return '<details class="piece" data-id="' + p.id + '"' + (isOpen ? ' open' : '') + '>' +
      '<summary>' +
        '<span class="p-platform"><svg class="picon"><use href="#' + pf.icon + '"/></svg>' + esc(pf.label) + '</span>' +
        '<span class="p-format">' + esc(FORMAT_LABEL[p.format] || p.format) + '</span>' +
        '<span class="angle' + (p.angle ? '' : ' empty') + '">' + (p.angle ? esc(p.angle) : 'Sin ángulo cargado') + '</span>' +
        '<span class="pill ' + st.cls + '">' + st.label + '</span>' +
        '<span class="mini-links">' + mini + '</span>' +
        '<button class="mlink-dup" data-action="duplicate" data-id="' + p.id + '" title="Duplicar (para otra plataforma)"><svg><use href="#i-duplicate"/></svg></button>' +
        '<button class="mlink-del" data-action="delete" data-id="' + p.id + '" title="Eliminar pieza"><svg><use href="#i-trash"/></svg></button>' +
      '</summary>' +
      '<div class="piece-detail">' +
        (p.estado === 'error' ? '<div class="note-banner">Esta pieza está marcada <b>Demorado</b> — revisá qué falta para destrabarla.</div>' : '') +
        '<div class="field-row field-row-3">' +
          '<div class="field"><label>Fecha</label><input type="date" value="' + p.date + '" data-id="' + p.id + '" data-field="date"></div>' +
          '<div class="field"><label>Plataforma</label><select data-id="' + p.id + '" data-field="platform">' +
            Object.keys(PLATFORM_META).map(function (k) { return '<option value="' + k + '"' + (k === p.platform ? ' selected' : '') + '>' + PLATFORM_META[k].label + '</option>'; }).join('') +
          '</select></div>' +
          formatFieldHtml(p) +
        '</div>' +
        '<div class="field"><label>Ángulo / título</label><input type="text" value="' + esc(p.angle) + '" data-id="' + p.id + '" data-field="angle"></div>' +
        '<div class="field"><label>Copy</label><textarea data-id="' + p.id + '" data-field="copy">' + esc(p.copy) + '</textarea></div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Material terminado</label>' + linkFieldHtml(p, 'material', 'Link a la pieza terminada') + '</div>' +
          '<div class="field"><label>Portada</label>' + linkFieldHtml(p, 'portada', 'Link a la portada') + '</div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Estado</label><select data-id="' + p.id + '" data-field="estado">' +
            Object.keys(STATUS_META).map(function (k) { return '<option value="' + k + '"' + (k === p.estado ? ' selected' : '') + '>' + STATUS_META[k].label + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="field"><label>Link publicado</label>' + linkFieldHtml(p, 'publicado', 'Se completa al publicar') + '</div>' +
        '</div>' +
        '<div class="field"><label>Notas</label><textarea data-id="' + p.id + '" data-field="notas">' + esc(p.notas) + '</textarea></div>' +
        '<div class="piece-detail-footer">' +
          '<button class="btn subtle" data-action="duplicate" data-id="' + p.id + '"><svg><use href="#i-duplicate"/></svg>Duplicar</button>' +
          '<button class="btn save-cta" data-action="save-now"><svg><use href="#i-save"/></svg><span class="btn-label">Guardar</span></button>' +
          '<button class="danger-btn" data-action="delete" data-id="' + p.id + '">Eliminar pieza</button>' +
        '</div>' +
      '</div>' +
    '</details>';
  }

  function renderLista(pieces) {
    if (!pieces.length) {
      return '<div class="empty-month"><p>No hay piezas planificadas para este mes todavía.</p></div>';
    }
    var sorted = pieces.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var rows = sorted.map(function (p) {
      var pf = PLATFORM_META[p.platform] || PLATFORM_META.instagram;
      var st = STATUS_META[p.estado] || STATUS_META.pendiente;
      var d = parseDate(p.date);
      return '<tr>' +
        '<td class="tnum">' + WD[d.getDay()] + ' ' + pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '</td>' +
        '<td><span class="cell-platform"><svg class="picon-sm"><use href="#' + pf.icon + '"/></svg>' + esc(pf.label) + '</span></td>' +
        '<td>' + esc(FORMAT_LABEL[p.format] || p.format) + '</td>' +
        '<td class="cell-angle"><span class="truncate' + (p.angle ? '' : ' empty') + '">' + (p.angle ? esc(p.angle) : 'Sin ángulo') + '</span></td>' +
        '<td><span class="pill ' + st.cls + '">' + st.label + '</span></td>' +
        '<td class="cell-copy"><span class="truncate' + (p.copy ? '' : ' empty') + '">' + (p.copy ? esc(p.copy.split('\n')[0]) : 'Sin copy') + '</span></td>' +
        '<td>' + (p.publicado ? '<a class="link" href="#" onclick="return false">' + esc(p.publicado) + '</a>' : '<span class="empty">—</span>') + '</td>' +
        '<td><button class="danger-btn" data-action="delete" data-id="' + p.id + '">Eliminar</button></td>' +
      '</tr>';
    }).join('');

    return '<div class="table-wrap"><table class="lista"><thead><tr>' +
      '<th>Fecha</th><th>Plataforma</th><th>Formato</th><th>Ángulo</th><th>Estado</th><th>Copy</th><th>Publicado</th><th>Acciones</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // ---------- events ----------
  function wireStaticEvents() {
    window.addEventListener('beforeunload', function (e) {
      if (hasUnsavedChanges()) { e.preventDefault(); e.returnValue = ''; }
    });
    $('month-prev').addEventListener('click', function () {
      currentMonth.m--; if (currentMonth.m < 1) { currentMonth.m = 12; currentMonth.y--; }
      renderAll();
    });
    $('month-next').addEventListener('click', function () {
      currentMonth.m++; if (currentMonth.m > 12) { currentMonth.m = 1; currentMonth.y++; }
      renderAll();
    });
    $('view-toggle').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-view]');
      if (!btn) return;
      viewMode = btn.dataset.view;
      $('view-toggle').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
      renderAll();
    });

    $('add-btn-header').addEventListener('click', openModal);
    $('fab-add').addEventListener('click', openModal);
    $('modal-platform').addEventListener('change', populateModalFormats);
    $('modal-cancel').addEventListener('click', closeModal);
    $('modal-backdrop').addEventListener('click', function (e) { if (e.target.id === 'modal-backdrop') closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    $('modal-submit').addEventListener('click', function () {
      var date = $('modal-date').value;
      if (!date) { $('modal-date').focus(); return; }
      addPiece(date, $('modal-platform').value, $('modal-format').value, $('modal-angle').value.trim());
      closeModal();
    });

    $('export-btn').addEventListener('click', exportCsv);
    $('save-btn').addEventListener('click', function () { handleSaveClick(this); });

    document.addEventListener('click', function (e) {
      var addToDay = e.target.closest('[data-action="add-to-day"]');
      if (addToDay) { addPiece(addToDay.dataset.date, 'instagram', 'REEL', ''); return; }

      var emptyAdd = e.target.closest('#empty-add-btn');
      if (emptyAdd) { openModal(); return; }

      var saveNowBtn = e.target.closest('[data-action="save-now"]');
      if (saveNowBtn) { handleSaveClick(saveNowBtn); return; }

      var dup = e.target.closest('[data-action="duplicate"]');
      if (dup) { e.preventDefault(); duplicatePiece(dup.dataset.id); return; }

      var del = e.target.closest('[data-action="delete"]');
      if (del) {
        e.preventDefault(); // avoid toggling a parent <summary> when the button lives there
        if (del.dataset.armed === '1') {
          removePiece(del.dataset.id);
        } else {
          var originalLabel = del.textContent;
          del.dataset.armed = '1';
          del.classList.add('armed');
          if (originalLabel.trim()) del.textContent = 'Confirmar borrado';
          del.title = 'Tocá de nuevo para confirmar';
          setTimeout(function () {
            del.dataset.armed = '0';
            del.classList.remove('armed');
            if (originalLabel.trim()) del.textContent = originalLabel;
            del.title = 'Eliminar pieza';
          }, 4000);
        }
        return;
      }
    });

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!t.dataset || !t.dataset.field || !t.dataset.id) return;
      if (t.tagName === 'SELECT') return;
      applyFieldChange(t.dataset.id, t.dataset.field, t.value, t);
      if (t.closest('.linkfield')) {
        var openLink = t.closest('.linkfield').querySelector('.open-btn');
        var url = normalizeUrl(t.value);
        if (openLink) {
          if (url) { openLink.setAttribute('href', url); openLink.classList.remove('disabled'); }
          else { openLink.removeAttribute('href'); openLink.classList.add('disabled'); }
        }
      }
    });
    document.addEventListener('change', function (e) {
      var t = e.target;
      if (!t.dataset || !t.dataset.field || !t.dataset.id) return;
      if (t.tagName !== 'SELECT' && t.type !== 'date') return;
      applyFieldChange(t.dataset.id, t.dataset.field, t.value, t, true);
    });
  }

  function applyFieldChange(id, field, value, inputEl, structural) {
    updateField(id, field, value);
    var pieceEl = inputEl.closest('details.piece');
    if (!pieceEl) return;

    if (field === 'angle') {
      var angleSpan = pieceEl.querySelector('summary .angle');
      angleSpan.textContent = value || 'Sin ángulo cargado';
      angleSpan.classList.toggle('empty', !value);
    } else if (field === 'estado') {
      var pillSpan = pieceEl.querySelector('summary .pill');
      var st = STATUS_META[value];
      pillSpan.className = 'pill ' + st.cls;
      pillSpan.textContent = st.label;
    } else if (field === 'format') {
      var formatSpan = pieceEl.querySelector('summary .p-format');
      if (formatSpan) formatSpan.textContent = value || '—';
    }
    refreshMiniLinks(pieceEl, id);

    if (structural && (field === 'date' || field === 'platform' || field === 'format')) {
      renderAll(id);
    }
  }

  function refreshMiniLinks(pieceEl) {
    var id = pieceEl.dataset.id;
    var found = findPieceById(id);
    if (!found) return;
    var piece = found.piece;
    var order = ['copy', 'material', 'portada', 'notas', 'publicado'];
    var icons = pieceEl.querySelectorAll('summary .mini-links .mlink');
    order.forEach(function (key, i) {
      var filled = piece[key] && piece[key].trim();
      icons[i].classList.toggle('filled', !!filled);
    });
  }

  function populateModalFormats() {
    var platform = $('modal-platform').value;
    if (usesFreeformFormat(platform)) {
      var meta = FREEFORM_META[platform];
      $('modal-format-label').textContent = meta.label;
      $('modal-format-slot').innerHTML = '<input type="text" id="modal-format" placeholder="' + esc(meta.placeholder) + '">';
      return;
    }
    $('modal-format-label').textContent = 'Formato';
    var opts = formatsFor(platform);
    $('modal-format-slot').innerHTML = '<select id="modal-format">' +
      opts.map(function (k) { return '<option value="' + k + '">' + FORMAT_LABEL[k] + '</option>'; }).join('') + '</select>';
  }

  function openModal() {
    $('modal-date').value = toDateInputValue(todayLocal());
    $('modal-angle').value = '';
    $('modal-platform').value = 'instagram';
    populateModalFormats();
    $('modal-backdrop').hidden = false;
    $('modal-date').focus();
  }
  function closeModal() { $('modal-backdrop').hidden = true; }

  // ---------- CSV export ----------
  function csvEscape(v) {
    v = v == null ? '' : String(v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  function buildCsv() {
    var header = ['Fecha', 'Plataforma', 'Formato', 'Ángulo', 'Copy', 'Material', 'Portada', 'Estado', 'Notas', 'Link publicado'];
    var sorted = flattenPieces().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var lines = [header.join(',')];
    sorted.forEach(function (p) {
      var pf = PLATFORM_META[p.platform] || {};
      lines.push([
        p.date, pf.label || p.platform, FORMAT_LABEL[p.format] || p.format,
        p.angle, p.copy, p.material, p.portada,
        (STATUS_META[p.estado] || {}).label || p.estado, p.notas, p.publicado
      ].map(csvEscape).join(','));
    });
    return lines.join('\r\n');
  }
  function exportCsv() {
    var csv = buildCsv();
    if (!window.claude || !window.claude.use) { showToast('La descarga no está disponible en esta vista.'); return; }
    window.claude.use('downloads').then(function (ns) {
      if (!ns) { showToast('La descarga no está disponible en esta vista.'); return; }
      return ns.save({ filename: 'tablero-contenidos.csv', data: '﻿' + csv }).then(function () {
        showToast('Descargado — guardalo en tu Drive como respaldo.');
      }).catch(function (err) {
        if (err && err.code !== 'declined') showToast('No se pudo descargar el archivo.');
      });
    }).catch(function () { showToast('La descarga no está disponible en esta vista.'); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
}
TableroApp(JSON.parse(document.getElementById('seed-data').textContent));
</script>
